<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>DARK ESSENCE Admin</title><link rel="stylesheet" href="/style.css">
<style>body{padding:0}.w{max-width:1100px;margin:auto;padding:20px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.tabs button{background:none;border:1px solid #c9972b55;padding:8px 16px;color:var(--g1)}.tabs .on{background:var(--g2);color:#000}table{width:100%;border-collapse:collapse;font-size:.85rem}td,th{border-bottom:1px solid #c9972b33;padding:8px;text-align:left;vertical-align:top}.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.k div{border:1px solid #c9972b44;padding:16px}.k b{display:block;font-size:1.6rem}.pe{border:1px solid #c9972b44;padding:14px;margin:12px 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.pe .a{grid-column:1/-1}.pe label{font-size:.7rem;color:var(--g2)}.ck{display:flex;gap:6px;align-items:center}.ck input{width:auto}.x{overflow-x:auto}</style></head><body><div class="w" id="r"></div>
<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)],esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const A=async(u,o)=>{const r=await fetch(u,o&&{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Failed');return j};
let tab='dash';
async function boot(){try{await A('/api/admin/me');shell()}catch{login()}}
function login(){$('#r').innerHTML=`<h1 class="gold serif">DARK ESSENCE Admin</h1><form id="lf" style="max-width:360px;margin-top:20px"><input type="password" id="pw" placeholder="Admin password" required><br><br><button class="btn">Sign in</button><p class="err" id="le"></p></form>`;$('#lf').onsubmit=async e=>{e.preventDefault();try{await A('/api/admin/login',{password:$('#pw').value});boot()}catch(x){$('#le').textContent=x.message}}}
function shell(){$('#r').innerHTML=`<h1 class="gold serif">DARK ESSENCE Admin</h1><div class="tabs">${[['dash','Dashboard'],['prod','Products'],['ord','Orders'],['cou','Coupons'],['del','Delivery']].map(([k,n])=>`<button data-t="${k}" class="${k===tab?'on':''}">${n}</button>`).join('')}<button id="lo">Sign out</button></div><div id="v"></div>`;
$$('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;shell()});$('#lo').onclick=async()=>{await A('/api/admin/logout',{});boot()};({dash,prod,ord,cou,del})[tab]()}
async function dash(){const s=await A('/api/admin/stats');$('#v').innerHTML=`<div class="k"><div>Total orders<b>${s.orders}</b></div><div>Sales (excl. cancelled)<b class="gold">₹${s.sales.toLocaleString('en-IN')}</b></div><div>Verified online payments<b>₹${s.paid.toLocaleString('en-IN')}</b></div></div><h3 class="serif" style="margin:20px 0 8px">Best sellers</h3>${s.top.map(t=>`<p>${esc(t[0])} — ${t[1]} sold</p>`).join('')||'<p>No orders yet.</p>'}<h3 class="serif" style="margin:20px 0 8px">Low stock (5 or fewer)</h3>${s.low.map(t=>`<p class="err">${esc(t.name)} — ${t.stock} left</p>`).join('')||'<p>All stocked.</p>'}`}
async function prod(){const ps=await (await fetch('/api/products')).json();const f=(p)=>`<div class="pe" data-s="${esc(p.slug||'')}"><div class="a"><b>${esc(p.name||'New product')}</b> ${p.img?`<img src="${p.img}" height="60" style="display:inline;vertical-align:middle">`:''}</div>
<div><label>Name</label><input data-k="name" value="${esc(p.name)}"></div><div><label>Category</label><input data-k="category" value="${esc(p.category||'perfume')}"></div><div><label>Selling price ₹</label><input data-k="price" type="number" value="${p.price??''}"></div><div><label>MRP ₹</label><input data-k="mrp" type="number" value="${p.mrp??''}"></div><div><label>Stock</label><input data-k="stock" type="number" value="${p.stock??0}"></div><div><label>Type</label><input data-k="type" value="${esc(p.type)}"></div><div><label>Size</label><input data-k="size" value="${esc(p.size)}"></div><div><label>Tagline</label><input data-k="tagline" value="${esc(p.tagline)}"></div>
<div class="a"><label>Description</label><textarea data-k="desc" rows="2">${esc(p.desc)}</textarea></div><div class="a"><label>Features (one per line)</label><textarea data-k="features" rows="2">${esc((p.features||[]).join('\n'))}</textarea></div>
<div class="a"><label>Photo</label><input type="file" data-up accept="image/png,image/jpeg,image/webp"><input type="hidden" data-k="img" value="${esc(p.img)}"></div>
<div class="a" style="display:flex;gap:16px;flex-wrap:wrap">${[['available','Available'],['featured','Featured'],['bestseller','Best seller'],['isNew','New arrival'],['limited','Limited edition']].map(([k,n])=>`<label class="ck"><input type="checkbox" data-c="${k}" ${p[k]?'checked':''}>${n}</label>`).join('')}</div>
<div class="a"><button class="btn" data-save>Save</button> ${p.slug?'<button class="btn o" data-del>Delete</button>':''}</div></div>`;
$('#v').innerHTML=`<button class="btn" id="np">+ Add product</button><div id="nw"></div>${ps.map(f).join('')}`;
$('#np').onclick=()=>{$('#nw').innerHTML=f({available:true,stock:0});bind()};bind();
function bind(){$$('.pe').forEach(e=>{e.onchange=async ev=>{if(ev.target.dataset.up!==undefined){const fl=ev.target.files[0];if(!fl)return;const d=await new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result);x.readAsDataURL(fl)});try{const u=await A('/api/admin/upload',{data:d});$('[data-k=img]',e).value=u.url;alert('Photo uploaded. Press Save.')}catch(x){alert(x.message)}}};
const sv=$('[data-save]',e);if(sv)sv.onclick=async()=>{const b={slug:e.dataset.s};$$('[data-k]',e).forEach(i=>b[i.dataset.k]=i.value);b.features=b.features.split('\n');$$('[data-c]',e).forEach(i=>b[i.dataset.c]=i.checked);try{await A('/api/admin/product',b);alert('Saved');prod()}catch(x){alert(x.message)}};
const dl=$('[data-del]',e);if(dl)dl.onclick=async()=>{if(confirm('Delete this product?')){await A('/api/admin/product/delete',{slug:e.dataset.s});prod()}}})}}
async function ord(){const os=await A('/api/admin/orders');const S=['Pending','Confirmed','Processing','Shipped','Delivered','Cancelled'];$('#v').innerHTML=`<div class="x"><table><tr><th>Order</th><th>Customer</th><th>Items</th><th>Total / payment</th><th>Status</th></tr>${os.map(o=>`<tr><td>${o.id}<br><small>${new Date(o.created).toLocaleString('en-IN')}</small></td><td>${esc(o.customer.name)}<br>${o.customer.phone}<br><small>${esc(o.customer.address)}, ${esc(o.customer.city)}, ${esc(o.customer.state)} ${o.customer.pin}</small></td><td>${o.lines.map(l=>`${esc(l.name)}${l.variantName?' ('+esc(l.variantName)+')':''} × ${l.qty}`).join('<br>')}</td><td>₹${o.total}${o.coupon?'<br><small>'+esc(o.coupon)+'</small>':''}<br>${o.payment.method.toUpperCase()} · ${o.payment.status}${o.payment.method==='cod'&&o.payment.status!=='paid'?`<br><label class="ck"><input type="checkbox" data-paid="${o.id}">COD collected</label>`:''}</td><td><select data-o="${o.id}">${S.map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')}</table></div>${os.length?'':'<p>No orders yet.</p>'}`;
$$('[data-o]').forEach(s=>s.onchange=async()=>{const c=$(`[data-paid="${s.dataset.o}"]`);await A('/api/admin/order',{id:s.dataset.o,status:s.value,codPaid:c&&c.checked});ord()});$$('[data-paid]').forEach(c=>c.onchange=async()=>{const s=$(`[data-o="${c.dataset.paid}"]`);await A('/api/admin/order',{id:c.dataset.paid,status:s.value,codPaid:c.checked});ord()})}
async function cou(){const cs=await A('/api/admin/coupons');const row=c=>`<form class="pe" data-cf><div><label>Code</label><input name="code" value="${esc(c.code||'')}" required></div><div><label>Type</label><select name="type"><option value="percent" ${c.type==='percent'?'selected':''}>% off</option><option value="flat" ${c.type==='flat'?'selected':''}>Flat ₹ off</option></select></div><div><label>Value</label><input name="value" type="number" value="${c.value||''}" required></div><div><label>Min order ₹</label><input name="min" type="number" value="${c.min||0}"></div><label class="ck"><input type="checkbox" name="active" ${c.active!==false&&c.code?'checked':!c.code?'checked':''}>Active</label><div><button class="btn">Save</button></div></form>`;$('#v').innerHTML=`<h3 class="serif">New coupon</h3>${row({})}<h3 class="serif">Existing</h3>${cs.map(row).join('')||'<p>None yet.</p>'}`;$$('[data-cf]').forEach(f=>f.onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(f));d.active=!!$('[name=active]',f).checked;try{await A('/api/admin/coupon',d);cou()}catch(x){alert(x.message)}})}
async function del(){const d=await A('/api/admin/delivery-get');$('#v').innerHTML=`<form class="pe" id="df"><div><label>Delivery charge ₹ (0 = none)</label><input name="charge" type="number" value="${d.charge||0}"></div><div class="a"><label>Serviceable PIN codes (comma/space separated; leave empty to accept any valid PIN)</label><textarea name="pincodes" rows="4">${(d.pincodes||[]).join(', ')}</textarea></div><div class="a"><button class="btn">Save</button></div></form>`;$('#df').onsubmit=async e=>{e.preventDefault();await A('/api/admin/delivery',Object.fromEntries(new FormData(e.target)));alert('Saved')}}
boot();
</script></body></html>
